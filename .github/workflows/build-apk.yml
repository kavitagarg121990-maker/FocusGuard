name: Build FocusGuard APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusGuard-v2.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Rename APK for Release
        run: cp app/build/outputs/apk/debug/app-debug.apk FocusGuard-v2.0.apk

      - name: Publish GitHub Release v2.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v2.0.0 --yes || true
          gh release create v2.0.0 FocusGuard-v2.0.apk \
            --title "FocusGuard v2.0.0 (Upgraded)" \
            --notes "FocusGuard v2.0 Upgraded APK: Package Visibility fix, Real-time App Search, Website Blocker (Chrome & browsers), Local Signup & Personalization, Focus Forest Tree Growth Animation, and Streaks."
