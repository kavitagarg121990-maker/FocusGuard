name: Build FocusGuard APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusGuard-v2.2-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Copy APK for GitHub Release
        run: cp app/build/outputs/apk/release/app-release.apk FocusGuard-v2.2-release.apk

      - name: Publish GitHub Release v2.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v2.2.0 --yes || true
          gh release create v2.2.0 FocusGuard-v2.2-release.apk \
            --title "FocusGuard v2.2.0 (Official Signed Release)" \
            --notes "Official Production Release of FocusGuard v2.2.0:
            - Verified Production Certificate (RSA 2048-bit Keystore, debuggable = false)
            - 1-to-1 Premium Dark Emerald Mockup UI
            - App Guard Status Card with 1-Tap Fix
            - Daily Focus Goal with Glowing Neon Gradient Bar
            - Stopwatch & Pomodoro with 'Pause (2)', '+ 5 min', and 'Finish & Bank Time'
            - 40+ Science-backed Focus & Digital Wellness Tips
            - Floating Bottom Navigation Dock"
