name: Build FocusGuard APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusGuard-v3.0-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Copy APK for GitHub Release
        run: cp app/build/outputs/apk/release/app-release.apk FocusGuard-v3.0-release.apk

      - name: Publish GitHub Release v3.0.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v3.0.0 --yes || true
          gh release create v3.0.0 FocusGuard-v3.0-release.apk \
            --title "FocusGuard v3.0.0 (Mascot Companion & AMOLED UI)" \
            --notes "FocusGuard v3.0.0 Major UI & Experience Upgrade:
            - Guardy Mascot Onboarding: Interactive study & exam survey + dotted mountain climb & shield animations
            - AMOLED Focus Dashboard: Circular goal gauge, multi-color Screen Time bar, Upcoming schedule, and floating Start Focus Timer pill
            - Start Focus Timer Sheet: Timer, Stopwatch & Pomodoro modes, customizable focus/break times, Blocked Apps & Ultra Focus toggle
            - Aurora Night Active Session: Immersive fullscreen northern lights countdown with tags, ambient audio, Guardy companion, and strict lock
            - 3+1 Floating Pill Navigation: Focus | Schedule | Groups + detached Blocks tab
            - Focus Schedules & Offline Groups: Quick schedule templates, custom schedules, and local study accountability rooms
            - Profile & Achievements: Hexagonal focus badges, total time overview, and weekly reports
            - 100% Offline & Official Keystore Signed: Zero internet permission, all Pro features unlocked free."
