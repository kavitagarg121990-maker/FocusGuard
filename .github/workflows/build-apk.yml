name: Build FocusGuard APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Signed Release APK with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusGuard-v2.3-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Copy APK for GitHub Release
        run: cp app/build/outputs/apk/release/app-release.apk FocusGuard-v2.3-release.apk

      - name: Publish GitHub Release v2.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v2.3.0 --yes || true
          gh release create v2.3.0 FocusGuard-v2.3-release.apk \
            --title "FocusGuard v2.3.0 (Official Signed Production Release)" \
            --notes "Official Production Release of FocusGuard v2.3.0:
            - ⚡ Instant 0ms App Blocking: Individual apps blocked immediately via real-time Accessibility interception
            - 🔔 Live Background Focus Timer & Notification: Persistent timer with Pause, +5m, and Finish controls that keeps ticking even when screen is locked or app is closed
            - 🔒 Official Release Keystore Signed: v1+v2+v3 signature scheme, debuggable = false, production Play Protect standard
            - ✏️ Editable Daily Goal: Tap the pencil icon directly on the goal card to customize daily hours and minutes
            - ⏱️ Editable Timer Modes: Switch easily between Stopwatch and custom Pomodoro sprints (15m, 25m, 45m, 60m)
            - 🩺 Permissions Doctor in Settings: Real-time status chips and 1-tap grant buttons for Accessibility, Usage Stats, Overlay, Notifications, and Battery Whitelist
            - 🖤 100% OLED Deep Black Theme: AMOLED blacks across all screens with glowing neon emerald styling and zero navigation bar overflow
            - 📴 100% Certified Private & Offline: Zero internet permission, all records stored securely on-device in SQLite"
